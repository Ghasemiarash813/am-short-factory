name: Short Factory

on:
  schedule:
    - cron: "7 3 * * *"   # daily ~03:07 UTC (06:37 Tehran)
  workflow_dispatch:

permissions:
  contents: write   # commit docs/, create releases
  models: read      # GitHub Models (free, keyless)
  pages: write
  id-token: write

concurrency:
  group: short-factory
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages (ffmpeg, fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-urw-base35 fonts-dejavu-core >/dev/null

      - name: Cache Kokoro voice model
        id: kcache
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Download Kokoro model (first run only)
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ls -la models

      - name: Python packages
        run: pip install -q -r requirements.txt

      - name: Make today's Short
        id: make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOKORO_DIR: models
        run: python factory/run.py

      - name: Publish MP4 as a Release (keep last 14)
        if: always() && hashFiles('out/release.env') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source out/release.env
          gh release create "$TAG" "out/$FILE" "docs/poster.jpg" --title "$TITLE" --notes-file out/notes.md --latest
          gh release list --limit 200 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[14:] | .[].tagName' | while read -r t; do
            [ -n "$t" ] && gh release delete "$t" --cleanup-tag -y || true
          done

      - name: Commit page data
        if: always()
        run: |
          git config user.name "am-short-factory[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --soft origin/main
            git add docs data
            git diff --cached --quiet && exit 0
            git commit -qm "Short factory: $(date -u +%F) run ${{ github.run_number }}"
            git push -q origin HEAD:main && break
            sleep 5
          done

      - uses: actions/configure-pages@v5
        if: always()

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: docs

  deploy:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
