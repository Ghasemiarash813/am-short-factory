name: Short Factory

on:
  schedule:
    - cron: "7 3 * * *"   # daily ~03:07 UTC (06:37 Tehran)
  workflow_dispatch:

permissions:
  contents: write   # commit docs/, create releases
  pages: write
  id-token: write

concurrency:
  group: short-factory
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages (ffmpeg, fonts)
        timeout-minutes: 6
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v ffmpeg >/dev/null && [ -f /usr/share/fonts/opentype/urw-base35/NimbusSans-Bold.otf ]; then echo "already installed"; exit 0; fi
          sudo timeout 150 apt-get update -qq -o Acquire::Retries=3 || true
          sudo timeout 180 apt-get install -y -qq --no-install-recommends ffmpeg fonts-urw-base35 fonts-dejavu-core >/dev/null || true

      - name: Cache Kokoro voice model
        id: kcache
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Download Kokoro model (first run only)
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ls -la models

      - name: Cache local LLM (Qwen3-4B-Instruct-2507 GGUF)
        id: lcache
        uses: actions/cache@v4
        with:
          path: models/llm
          key: qwen3-4b-instruct-2507-q4km

      - name: Download local LLM (first run only)
        if: steps.lcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models/llm
          curl -sSL --retry 3 -o models/llm/model.gguf https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
          ls -la models/llm

      - name: Start llama.cpp server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B=b12078
          if ! curl -sSfL -o llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/$B/llama-$B-bin-ubuntu-x64.tar.gz"; then
            B=$(gh release view -R ggml-org/llama.cpp --json tagName -q .tagName)
            curl -sSfL -o llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/$B/llama-$B-bin-ubuntu-x64.tar.gz"
          fi
          mkdir -p llama && tar xzf llama.tgz -C llama --strip-components=1
          cd llama && LD_LIBRARY_PATH=. nohup ./llama-server -m ../models/llm/model.gguf -c 12288 -np 1 -t $(nproc) --host 127.0.0.1 --port 8080 > ../llama.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8080/health >/dev/null && echo "llama-server ready after ${i}s" && exit 0; sleep 2; done
          tail -50 llama.log; exit 1

      - name: Python packages (+ static ffmpeg fallback)
        run: |
          pip install -q -r requirements.txt
          if ! command -v ffmpeg >/dev/null; then
            pip install -q imageio-ffmpeg
            mkdir -p "$HOME/bin"; ln -sf "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/bin/ffmpeg"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi

      - name: Make today's Short
        id: make
        env:
          KOKORO_DIR: models
          LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python factory/run.py

      - name: Publish MP4 as a Release (keep last 14)
        if: always() && hashFiles('out/release.env') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source out/release.env
          gh release create "$TAG" "out/$FILE" "docs/poster.jpg" --title "$TITLE" --notes-file out/notes.md --latest
          gh release list --limit 200 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[14:] | .[].tagName' | while read -r t; do
            [ -n "$t" ] && gh release delete "$t" --cleanup-tag -y || true
          done

      - name: Commit page data
        if: always()
        run: |
          git config user.name "am-short-factory[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --soft origin/main
            git add docs data
            git diff --cached --quiet && exit 0
            git commit -qm "Short factory: $(date -u +%F) run ${{ github.run_number }}"
            git push -q origin HEAD:main && break
            sleep 5
          done

      - uses: actions/configure-pages@v5
        if: always()

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: docs

  deploy:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
