<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کارخانه شورت · Ancient Machines</title>
<meta name="theme-color" content="#140b2e">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{--glass:rgba(255,255,255,.10);--line:rgba(255,255,255,.22);--txt:#f5f3ff;--muted:#c9c3e6;--gold:#ffd640}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Vazirmatn,system-ui,-apple-system,sans-serif;color:var(--txt);background:#120a2a}
body{padding:max(18px,env(safe-area-inset-top)) 14px 40px;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.75;z-index:-1;animation:float 18s ease-in-out infinite alternate}
.b1{width:360px;height:360px;background:#7c3aed;top:-80px;right:-90px}
.b2{width:320px;height:320px;background:#06b6d4;top:35%;left:-120px;animation-delay:-6s}
.b3{width:300px;height:300px;background:#f59e0b;bottom:-90px;right:-60px;animation-delay:-12s}
.b4{width:220px;height:220px;background:#ec4899;top:60%;right:30%;opacity:.45}
@keyframes float{to{transform:translate(40px,60px) scale(1.15)}}
.wrap{max-width:720px;margin:0 auto}
.card{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid var(--line);border-radius:26px;padding:18px;margin:14px 0;
 backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35)}
h1{font-size:23px;margin:4px 0 2px;font-weight:800}
h2{font-size:16px;margin:0 0 10px;color:var(--gold);font-weight:700;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:13px}
.chip{display:inline-block;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(34,197,94,.25);border:1px solid rgba(34,197,94,.6)}
.chip.err{background:rgba(239,68,68,.25);border-color:rgba(239,68,68,.7)}
.chip.warn{background:rgba(245,158,11,.25);border-color:rgba(245,158,11,.7)}
.en{direction:ltr;text-align:left;font-family:-apple-system,system-ui,sans-serif;unicode-bidi:plaintext}
.box{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px;white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.55}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{appearance:none;border:1px solid rgba(255,255,255,.35);background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.08));color:#fff;
 padding:10px 16px;border-radius:14px;font:inherit;font-weight:700;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.btn.gold{background:linear-gradient(135deg,#ffd640,#f59e0b);color:#1b1030;border-color:#ffe58a}
.btn:active{transform:scale(.97)}
video{width:100%;max-height:70vh;border-radius:18px;background:#000;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:rgba(0,0,0,.22);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#06b6d4,#a78bfa,#ffd640)}
.cand{padding:12px;border-radius:16px;background:rgba(0,0,0,.2);margin:8px 0;border:1px solid transparent}
.cand.on{border-color:var(--gold);background:rgba(255,214,64,.10)}
.cand a{color:#fff}
ol{margin:0;padding-inline-start:22px}
li{margin:4px 0}
a{color:#a5f3fc}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(20,10,46,.9);border:1px solid var(--line);padding:10px 18px;border-radius:99px;opacity:0;transition:.3s;backdrop-filter:blur(10px)}
.toast.show{opacity:1}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
<div class="wrap" id="app">
  <div class="card"><h1>🏭 کارخانه شورت</h1><div class="sub">در حال بارگذاری…</div></div>
</div>
<div class="toast" id="toast">کپی شد ✅</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const COPY={};
function copy(k){const t=COPY[k]||'';
  const done=()=>{const e=$('#toast');e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1400)};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,()=>fallback(t,done))}else fallback(t,done)}
function fallback(t,done){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.focus();a.select();try{document.execCommand('copy');done()}catch(e){}a.remove()}
function block(title,key,text,en=true){COPY[key]=text;
  return `<div class="card"><h2>${title}</h2><div class="box ${en?'en':''}">${esc(text)}</div><div class="row"><button class="btn" onclick="copy('${key}')">📋 کپی</button></div></div>`}
function shortCards(s,stale){
  const dur=s.duration_s||0, pct=Math.min(100,Math.round(dur/60*100));
  const photos=(s.visuals||[]).filter(v=>v==='photo').length, total=(s.visuals||[]).length;
  return `
  <div class="card">
    <h2>🎬 شورت ${stale?'آخرین (قدیمی‌تر)':'امروز'}</h2>
    <video controls playsinline preload="none" poster="${esc(s.poster)}" src="${esc(s.video_url)}"></video>
    <div class="row">
      <a class="btn gold" href="${esc(s.video_url)}" download>⬇️ دانلود MP4</a>
      <a class="btn" href="${esc(s.release_url)}">📦 صفحه Release</a>
    </div>
    <div class="stats">
      <div class="stat"><b>${fa(dur)}</b><span>ثانیه</span></div>
      <div class="stat"><b>${fa(s.size_mb||0)}</b><span>مگابایت</span></div>
      <div class="stat"><b>${fa(photos)}/${fa(total)}</b><span>عکس واقعی</span></div>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="small" style="margin-top:6px">صدا: ${esc(s.voice)} · مدل: ${esc(s.model||'')}</div>
  </div>
  ${block('🏷️ عنوان یوتیوب','title',s.title)}
  <div class="card"><h2>🪝 هوک (جمله اول)</h2><div class="box en">${esc(s.hook)}</div></div>
  ${block('📝 توضیحات','desc',s.description)}
  ${block('🔖 تگ‌ها','tags',s.tags_csv)}
  ${block('📌 کامنت پین','pin',s.pinned_comment)}
  <div class="card"><h2>🔗 Related video (هنگام آپلود انتخاب کن)</h2>
    <div class="box en">${esc(s.related_video.title)}<br><a href="${esc(s.related_video.url)}">${esc(s.related_video.url)}</a></div></div>
  ${block('🎙️ متن کامل گوینده','script',(s.script||[]).join('\n'))}
  <div class="card"><h2>📰 منبع خبر</h2><div class="box en"><a href="${esc(s.source.url)}">${esc(s.source.headline)}</a><br>${esc(s.source.name)} · ${esc(s.source.published)}</div>
  ${(s.credits||[]).length?`<div class="small en" style="margin-top:8px">${s.credits.map(c=>`<a href="${esc(c.page)}">${esc(c.credit)}</a>`).join('<br>')}</div>`:''}
  ${(s.fact_check||[]).length?`<div class="small" style="margin-top:8px">✔️ بررسی واقعیت اصلاح کرد: <span class="en">${esc(s.fact_check.join(' | '))}</span></div>`:''}
  </div>`}
fetch('today.json?ts='+Date.now()).then(r=>r.json()).then(d=>{
  let h=`<div class="card"><h1>🏭 کارخانه شورت Ancient Machines</h1>
   <div class="sub">${fa(d.generated_at_tehran||'')} (تهران)</div>
   <div class="row">${d.status==='ok'?'<span class="chip">✅ آماده</span>':d.status==='no_story'?'<span class="chip warn">⏸ خبر تازه نبود</span>':'<span class="chip err">⚠️ خطا</span>'}
   <a class="btn" href="siri.html">🗣️ سیری</a><a class="btn" href="${esc(d.run_url)}">⚙️ اجرا</a></div>
   ${d.message?`<div class="box" style="margin-top:10px">${esc(d.message)}</div>`:''}</div>`;
  if(d.short) h+=shortCards(d.short,false);
  else if(d.last_ok&&d.last_ok.short) h+=shortCards(d.last_ok.short,true);
  if((d.candidates||[]).length){
    h+=`<div class="card"><h2>🗞️ ۳ خبر نامزد امروز</h2>`+d.candidates.map((c,i)=>`<div class="cand ${d.short&&d.short.source&&c.title===d.short.source.headline?'on':''}">
      <div class="en"><a href="${esc(c.link)}">${esc(c.title)}</a></div>
      <div class="small">${esc(c.source)} · ${fa(c.age_h)} ساعت پیش · امتیاز ${fa(c.score)}</div>
      <div class="small en">${esc(c.why||'')}</div></div>`).join('')+`</div>`}
  if((d.archive||[]).length){
    h+=`<div class="card"><h2>🗂️ آرشیو ۱۴ روز</h2><ol>`+d.archive.map(a=>`<li><a href="${esc(a.release_url)}" class="en">${esc(a.title)}</a> <span class="small">${fa(a.date)}</span></li>`).join('')+`</ol></div>`}
  h+=`<div class="card small">هر روز ساعت ۰۶:۳۷ تهران خودکار ساخته می‌شود (GitHub Actions، رایگان). فقط شورت‌ها را خودت در یوتیوب آپلود کن: فایل را دانلود کن ← YouTube ← Create ← عنوان/توضیحات/تگ را از اینجا کپی کن ← Related video را انتخاب کن.</div>`;
  $('#app').innerHTML=h;
}).catch(e=>{$('#app').innerHTML=`<div class="card"><h1>🏭 کارخانه شورت</h1><div class="box">هنوز داده‌ای نیست یا خطا: ${esc(e)}</div></div>`});
</script>
</body>
</html>
